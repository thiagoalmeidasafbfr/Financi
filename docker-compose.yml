# App + PostgreSQL. Uso: docker compose up --build  →  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: financi
      POSTGRES_PASSWORD: financi
      POSTGRES_DB: financi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financi"]
      interval: 3s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://financi:financi@db:5432/financi
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
